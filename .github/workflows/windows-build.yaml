name: "Windows build"

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: choco install yq
      - name: Enable Git longpaths
        run: git config --system core.longpaths true
      - name: Set up Flutter
        uses: subosito/flutter-action@v2.16.0
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
      - run: flutter pub get
      - name: Check DanDanPlay secrets
        shell: pwsh
        env:
          DANDANAPI_APPID: ${{ secrets.DANDANAPI_APPID }}
          DANDANAPI_KEY: ${{ secrets.DANDANAPI_KEY }}
        run: |
          if ([string]::IsNullOrEmpty($env:DANDANAPI_APPID) -or [string]::IsNullOrEmpty($env:DANDANAPI_KEY)) {
            Write-Host "::warning::未配置 DANDANAPI_APPID / DANDANAPI_KEY，打包可继续，但需要在软件 设置->弹幕设置 中填写凭证后才能加载弹幕"
          }
      - name: Build Windows
        shell: pwsh
        env:
          DANDANAPI_APPID: ${{ secrets.DANDANAPI_APPID }}
          DANDANAPI_KEY: ${{ secrets.DANDANAPI_KEY }}
          KAZUMI_APPID: ${{ secrets.KAZUMI_APPID }}
          KAZUMI_KEY: ${{ secrets.KAZUMI_KEY }}
        run: >-
          flutter build windows
          --dart-define=DANDANAPI_APPID=$env:DANDANAPI_APPID
          --dart-define=DANDANAPI_KEY=$env:DANDANAPI_KEY
          --dart-define=KAZUMI_APPID=$env:KAZUMI_APPID
          --dart-define=KAZUMI_KEY=$env:KAZUMI_KEY
      - run: Compress-Archive build/windows/x64/runner/Release/* Kazumi_windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Kazumi_windows
          path: Kazumi_windows.zip
